openapi: 3.0.0
info:
  title: API de la entidad Curso
  version: 1.0.0

paths:
  /cursos:
    post:
      summary: Crear un curso nuevo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursoRequest'
      responses:
        '201':
          description: Curso creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
        '400':
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: Obtener todos los cursos creados (con filtro opcional por codigo)
      parameters:
        - name: codigo
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Lista de cursos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Curso'
        '404':
          description: No se encontro el curso con el codigo ingresado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /cursos/{id}:
    put:
      summary: Actualizar el curso por id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CursoRequest'
      responses:
        '200':
          description: Curso actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
        '400':
          description: Datos invalidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Curso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Eliminar curso por id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Curso eliminado correctamente
        '404':
          description: Curso no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    CursoRequest:
      type: object
      properties:
        nombre:
          type: string
        codigo:
          type: string
        creditos:
          type: integer
        estado:
          type: boolean
          example: true

    Curso:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        codigo:
          type: string
        creditos:
          type: integer
        estado:
          type: bolean
          example: true
    
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string